{% extends "base.html" %}
{% block contenido %}
{% set d = datos or {} %}
<div class="tarjeta" style="max-width:560px">
  <h1>Crear cuenta de paciente</h1>
  <p class="muted">Solo pacientes nuevos. Los médicos y el administrador se crean por fuera de este formulario. Todos los datos de esta demo son ficticios.</p>
  <form method="post" action="{{ url_for('registro') }}">
    <label for="nombre">Nombre completo</label>
    <input id="nombre" name="nombre" required value="{{ d.get('nombre','') }}">
    <label for="documento">Documento</label>
    <input id="documento" name="documento" required value="{{ d.get('documento','') }}">
    <label for="telefono">Teléfono</label>
    <input id="telefono" name="telefono" value="{{ d.get('telefono','') }}">
    <label for="email">Correo</label>
    <input id="email" name="email" type="email" required value="{{ d.get('email','') }}">
    <label for="password">Contraseña (mínimo 6 caracteres)</label>
    <input id="password" name="password" type="password" required minlength="6">
    <div class="radio">
      <label><input type="checkbox" name="consentimiento" value="si" {{ 'checked' if d.get('consentimiento') }}>
        Acepto el tratamiento de mis datos de salud (Ley 1581 de 2012).</label>
    </div>
    <p><button class="boton verde" type="submit">Crear cuenta</button></p>
  </form>
  <p class="muted">¿Ya tienes cuenta? <a href="{{ url_for('inicio') }}">Inicia sesión</a></p>
</div>
{% endblock %}
